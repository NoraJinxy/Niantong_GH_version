site_name: 念析 ELYS 文档
site_description: 念析 ELYS EEG 数据分析平台文档
site_author: 念析 ELYS
site_url: https://huanggan.site/elys_doc/

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: false

theme:
  name: material
  language: zh
  font: false
  logo: assets/elys-logo.svg
  favicon: assets/elys-logo.svg
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tooltips

extra_css:
  - assets/stylesheets/elys.css

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

exclude_docs: |
  _*.md
  drafts/**

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: ignore

nav:
  - 首页: index.md
  - 0 协作规范:
      - 协作规范总览: 0-00-协作规范总览.md
      - 术语与统一约束: 0-10-术语与统一约束.md
      - 文档编写规范: 0-20-文档编写规范.md
      - 人机协作规则: 0-30-人机协作规则.md
      - 冲突处理与权威来源: 0-40-冲突处理与权威来源.md
  - 1 需求分析:
      - 需求分析总览: 1-00-需求分析总览.md
      - 项目背景与产品定位: 1-10-项目背景与产品定位.md
